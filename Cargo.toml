[package]
name = "ancs-linux"
version = "1.1.0"
edition = "2024"
description = "Mirrors iPhone notifications to the Linux desktop over Bluetooth LE (ANCS)"
license = "MIT"
repository = "https://github.com/schizophrenicautist/ancs-linux"
readme = "README.md"
keywords = ["ancs", "iphone", "bluetooth", "notifications", "kde"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = "1.28.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
